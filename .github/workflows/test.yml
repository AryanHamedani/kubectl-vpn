name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q vpnctl.py install.py container
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kubectl-vpn:test container
      - run: RUN_DOCKER_TESTS=1 VPN_TEST_IMAGE=kubectl-vpn:test python3 -m unittest discover -s tests -p test_container_hooks.py -v
